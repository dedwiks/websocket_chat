<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>chatbase | Register</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3bbffa",
                        "primary-container": "#22b1ec",
                        "on-primary-container": "#002b3d",
                        "surface": "#060e20",
                        "surface-container-highest": "#192540",
                        "on-surface": "#dee5ff",
                        "on-surface-variant": "#a3aac4",
                        "outline-variant": "#40485d",
                        "error": "#ff716c",
                        "error-container": "#9f0519",
                        "on-error-container": "#ffa8a3"
                    },
                    fontFamily: {
                        headline: ["Manrope"],
                        body: ["Inter"]
                    }
                }
            }
        };
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-panel {
            background: rgba(25, 37, 64, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center overflow-hidden selection:bg-primary/30 selection:text-primary">
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] bg-primary/10 rounded-full blur-[150px]"></div>
    </div>
    <main class="relative w-full max-w-md z-10 px-6">
        <div class="flex flex-col items-center mb-8">
            <div class="mb-4">
                <span class="material-symbols-outlined text-5xl text-primary font-bold" style="font-variation-settings: 'FILL' 1;">forum</span>
            </div>
            <h1 class="font-headline text-3xl font-black text-on-surface tracking-widest lowercase">chatbase</h1>
            <p class="text-on-surface-variant text-sm font-medium mt-1">Create your account</p>
        </div>
        <div class="glass-panel p-8 rounded-xl shadow-[0_32px_64px_-12px_rgba(59,191,250,0.06)] border-t border-white/5">
            <div class="mb-8">
                <h2 class="font-headline text-2xl font-bold text-on-surface">Register</h2>
                <p class="text-on-surface-variant text-sm mt-2">Choose a username and password, then return to login.</p>
            </div>
            <form id="register-form" class="space-y-6">
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-primary tracking-widest uppercase ml-1">Username</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-lg">alternate_email</span>
                        </div>
                        <input id="register-username" class="w-full bg-surface-container-highest border-none text-on-surface placeholder:text-on-surface-variant/40 rounded-lg py-3.5 pl-12 pr-4 focus:ring-0 transition-all font-body" placeholder="username" required type="text"/>
                        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-[2px] bg-primary group-focus-within:w-full transition-all duration-300"></div>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-primary tracking-widest uppercase ml-1">ID / Password</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-lg">lock</span>
                        </div>
                        <input id="register-password" class="w-full bg-surface-container-highest border-none text-on-surface placeholder:text-on-surface-variant/40 rounded-lg py-3.5 pl-12 pr-12 focus:ring-0 transition-all font-body" placeholder="Enter your password" required type="password"/>
                        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-[2px] bg-primary group-focus-within:w-full transition-all duration-300"></div>
                    </div>
                </div>
                <div id="register-success" class="hidden items-start bg-primary/10 p-3 rounded-lg border border-primary/20">
                    <span class="material-symbols-outlined text-primary text-lg mr-2">check_circle</span>
                    <p class="text-xs text-on-surface font-medium">Registration successful. Redirecting to login...</p>
                </div>
                <div id="register-error" class="hidden items-start bg-error-container/10 p-3 rounded-lg border border-error-container/20">
                    <span class="material-symbols-outlined text-error text-lg mr-2">error</span>
                    <p id="register-error-text" class="text-xs text-on-error-container font-medium">Registration failed.</p>
                </div>
                <div class="space-y-3 pt-2">
                    <button type="submit" class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary-container font-headline font-bold py-4 rounded-xl shadow-[0_8px_24px_rgba(59,191,250,0.2)] hover:shadow-[0_12px_32px_rgba(59,191,250,0.3)] transition-all active:scale-95">
                        Create account
                    </button>
                    <a href="/" class="block w-full text-center bg-transparent text-on-surface font-headline font-bold py-4 rounded-xl border border-outline-variant/20 hover:bg-surface-container-highest transition-all active:scale-95">
                        Back to login
                    </a>
                </div>
            </form>
        </div>
    </main>
    <script>
        async function request(path, method, body) {
            const response = await fetch(path, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.error || "request failed");
            }
            return payload;
        }

        const form = document.getElementById("register-form");
        const username = document.getElementById("register-username");
        const password = document.getElementById("register-password");
        const errorBox = document.getElementById("register-error");
        const errorText = document.getElementById("register-error-text");
        const successBox = document.getElementById("register-success");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorBox.classList.add("hidden");
            successBox.classList.add("hidden");
            try {
                await request("/register", "POST", {
                    username: username.value,
                    password: password.value
                });
                successBox.classList.remove("hidden");
                setTimeout(() => {
                    window.location.href = "/";
                }, 1000);
            } catch (error) {
                errorText.textContent = error.message;
                errorBox.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
