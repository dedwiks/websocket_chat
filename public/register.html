<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>chatbase | Register</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#0f766e",
                        surface: "#f3f4f6",
                        "surface-container": "#ffffff",
                        "on-surface": "#111827",
                        "on-surface-variant": "#6b7280",
                        "outline-variant": "#d1d5db",
                        error: "#b91c1c",
                        "error-container": "#fef2f2",
                        "on-error-container": "#991b1b"
                    },
                    fontFamily: {
                        sans: ["IBM Plex Sans", "sans-serif"]
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-surface font-sans text-on-surface min-h-screen">
    <main class="mx-auto flex min-h-screen max-w-md items-center px-6 py-16">
        <div class="w-full space-y-8">
            <header class="space-y-2 text-center">
                <h1 class="text-3xl font-semibold tracking-tight">chatbase</h1>
                <p class="text-sm text-on-surface-variant">Create your account.</p>
            </header>

            <section class="rounded-xl border border-outline-variant bg-surface-container p-8">
                <div class="mb-8 space-y-1">
                    <h2 class="text-xl font-semibold">Register</h2>
                    <p class="text-sm text-on-surface-variant">Choose a username and password, then return to login.</p>
                </div>

                <form id="register-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="block text-sm font-medium" for="register-username">Username</label>
                        <input id="register-username" class="w-full rounded-lg border border-outline-variant bg-white px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary/15" placeholder="Username" required type="text"/>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-medium" for="register-password">Password</label>
                        <input id="register-password" class="w-full rounded-lg border border-outline-variant bg-white px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary/15" placeholder="Password" required type="password"/>
                    </div>

                    <div id="register-success" class="hidden items-start gap-2 rounded-lg border border-primary/15 bg-[#f0fdfa] px-4 py-3">
                        <span class="material-symbols-outlined text-primary text-base">check_circle</span>
                        <p class="text-sm text-on-surface">Registration successful. Redirecting to login...</p>
                    </div>

                    <div id="register-error" class="hidden items-start gap-2 rounded-lg border border-error/15 bg-error-container px-4 py-3">
                        <span class="material-symbols-outlined text-error text-base">error</span>
                        <p id="register-error-text" class="text-sm text-on-error-container">Registration failed.</p>
                    </div>

                    <div class="space-y-3 pt-2">
                        <button type="submit" class="w-full rounded-lg bg-primary px-4 py-3 text-sm font-medium text-white hover:bg-[#0b5c56] focus:outline-none focus:ring-2 focus:ring-primary/20">
                            Create account
                        </button>
                        <a href="/" class="block w-full rounded-lg border border-outline-variant px-4 py-3 text-center text-sm font-medium text-on-surface hover:bg-surface">
                            Back to login
                        </a>
                    </div>
                </form>
            </section>
        </div>
    </main>
    <script>
        async function request(path, method, body) {
            const response = await fetch(path, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.error || "request failed");
            }
            return payload;
        }

        const form = document.getElementById("register-form");
        const username = document.getElementById("register-username");
        const password = document.getElementById("register-password");
        const errorBox = document.getElementById("register-error");
        const errorText = document.getElementById("register-error-text");
        const successBox = document.getElementById("register-success");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorBox.classList.add("hidden");
            successBox.classList.add("hidden");

            try {
                await request("/register", "POST", {
                    username: username.value,
                    password: password.value
                });
                successBox.classList.remove("hidden");
                setTimeout(() => {
                    window.location.href = "/";
                }, 1000);
            } catch (error) {
                errorText.textContent = error.message;
                errorBox.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
