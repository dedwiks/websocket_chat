<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>chatbase</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#0f766e",
                        "primary-container": "#ccfbf1",
                        "on-primary-container": "#134e4a",
                        surface: "#f3f4f6",
                        "surface-container": "#ffffff",
                        "surface-container-low": "#f9fafb",
                        "surface-container-highest": "#ffffff",
                        "surface-bright": "#ffffff",
                        "on-surface": "#111827",
                        "on-surface-variant": "#6b7280",
                        "outline-variant": "#d1d5db",
                        error: "#b91c1c",
                        "error-container": "#fef2f2",
                        "on-error-container": "#991b1b"
                    },
                    fontFamily: {
                        sans: ["IBM Plex Sans", "sans-serif"],
                        headline: ["IBM Plex Sans", "sans-serif"],
                        body: ["IBM Plex Sans", "sans-serif"]
                    }
                }
            }
        };
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
    </style>
</head>
<body class="bg-surface font-sans text-on-surface min-h-screen">
    <div id="login-view" class="min-h-screen flex items-center justify-center px-6 py-16">
        <main class="w-full max-w-md space-y-8">
            <header class="space-y-2 text-center">
                <h1 class="text-3xl font-semibold tracking-tight">chatbase</h1>
                <p class="text-sm text-on-surface-variant">Sign in to your workspace.</p>
            </header>

            <section class="bg-surface-container border border-outline-variant rounded-xl p-8">
                <div class="space-y-1 mb-8">
                    <h2 class="text-xl font-semibold">Login</h2>
                    <p class="text-sm text-on-surface-variant">Enter your account details to continue.</p>
                </div>

                <form id="login-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="block text-sm font-medium" for="username">Username</label>
                        <input id="username" class="w-full rounded-lg border border-outline-variant bg-white px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary/15" placeholder="Username" required type="text"/>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-medium" for="password">Password</label>
                        <input id="password" class="w-full rounded-lg border border-outline-variant bg-white px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary/15" placeholder="Password" required type="password"/>
                    </div>

                    <div id="login-error" class="hidden items-start gap-2 rounded-lg border border-error/15 bg-error-container px-4 py-3">
                        <span class="material-symbols-outlined text-error text-base">error</span>
                        <p id="login-error-text" class="text-sm text-on-error-container">Invalid credentials detected.</p>
                    </div>

                    <div class="space-y-3 pt-2">
                        <button type="submit" class="w-full rounded-lg bg-primary px-4 py-3 text-sm font-medium text-white hover:bg-[#0b5c56] focus:outline-none focus:ring-2 focus:ring-primary/20">
                            Login
                        </button>
                        <a id="register-btn" href="/register" class="block w-full rounded-lg border border-outline-variant px-4 py-3 text-center text-sm font-medium text-on-surface hover:bg-surface">
                            Create an account
                        </a>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <div id="chat-view" class="hidden min-h-screen">
        <div class="mx-auto flex min-h-screen max-w-[1440px]">
            <aside class="w-full max-w-[320px] border-r border-outline-variant bg-surface-container">
                <div class="flex h-full flex-col">
                    <div class="space-y-6 border-b border-outline-variant px-6 py-6">
                        <div class="flex items-center justify-between gap-4">
                            <div>
                                <h1 class="text-xl font-semibold tracking-tight">chatbase</h1>
                                <p class="mt-1 text-sm text-on-surface-variant">Team messaging</p>
                            </div>
                            <button id="logout-btn" type="button" class="text-sm font-medium text-primary hover:underline">
                                Back to login
                            </button>
                        </div>

                        <div class="flex items-center gap-3 rounded-lg border border-outline-variant px-4 py-4">
                            <div class="flex h-10 w-10 items-center justify-center rounded-full bg-primary-container text-sm font-semibold text-on-primary-container" id="my-avatar">A</div>
                            <div class="min-w-0 flex-1">
                                <div id="my-username" class="truncate text-sm font-medium">...</div>
                                <div class="mt-1 flex items-center gap-2 text-sm text-on-surface-variant">
                                    <span id="connection-indicator" class="h-2.5 w-2.5 rounded-full bg-on-surface-variant"></span>
                                    <span id="connection-status-text">Offline</span>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm font-medium" for="user-search">Search users</label>
                            <div class="relative">
                                <input id="user-search" class="w-full rounded-lg border border-outline-variant bg-white px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary/15" placeholder="Search by username" type="text"/>
                                <div id="search-results" class="hidden absolute left-0 right-0 top-full z-50 mt-2 rounded-lg border border-outline-variant bg-white p-2"></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto px-4 py-6">
                        <div class="mb-3 text-sm font-medium text-on-surface-variant">Conversations</div>
                        <div id="sidebar-conversations-list" class="space-y-1"></div>
                    </div>
                </div>
            </aside>

            <main class="flex min-w-0 flex-1 flex-col bg-surface">
                <header class="border-b border-outline-variant bg-surface px-8 py-5">
                    <div class="flex items-center gap-4" id="chat-header-info" style="visibility: hidden;">
                        <div id="active-chat-avatar" class="flex h-10 w-10 items-center justify-center rounded-full bg-primary-container text-sm font-semibold text-on-primary-container">?</div>
                        <div class="min-w-0">
                            <h2 id="active-chat-name" class="truncate text-lg font-semibold">Select a chat</h2>
                            <p id="active-chat-typing" class="hidden text-sm text-on-surface-variant">Typing...</p>
                        </div>
                    </div>
                </header>

                <div id="chat-messages-container" class="flex flex-1 flex-col gap-4 overflow-y-auto px-8 py-8">
                    <div class="m-auto text-sm text-on-surface-variant">Select a user or search to start a direct conversation.</div>
                </div>

                <footer id="chat-input-area" class="border-t border-outline-variant bg-surface px-8 py-6 opacity-50 pointer-events-none">
                    <form id="message-form" class="mx-auto flex max-w-4xl items-center gap-3">
                        <input id="message-input" autocomplete="off" class="min-w-0 flex-1 rounded-lg border border-outline-variant bg-white px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary/15" placeholder="Write a message" type="text"/>
                        <button type="submit" class="rounded-lg bg-primary px-5 py-3 text-sm font-medium text-white hover:bg-[#0b5c56] focus:outline-none focus:ring-2 focus:ring-primary/20" id="send-btn">
                            Send
                        </button>
                    </form>
                </footer>
            </main>
        </div>
    </div>

    <template id="tpl-incoming-msg">
        <div class="max-w-3xl">
            <div class="rounded-lg border border-outline-variant bg-white px-4 py-3 message-bubble">
                <p class="message-text text-sm leading-6"></p>
            </div>
            <span class="message-time mt-2 block text-xs text-on-surface-variant"></span>
        </div>
    </template>

    <template id="tpl-outgoing-msg">
        <div class="ml-auto max-w-3xl" id="msg-">
            <div class="rounded-lg bg-primary px-4 py-3 text-white message-bubble opacity-80">
                <p class="message-text text-sm leading-6"></p>
            </div>
            <span class="message-time-status mt-2 flex items-center justify-end gap-1 text-xs text-on-surface-variant">
                <span class="message-time"></span>
                <span class="material-symbols-outlined text-sm msg-status-icon">schedule</span>
            </span>
        </div>
    </template>

    <template id="tpl-convo-list-item">
        <div class="conversation-item flex items-center gap-3 rounded-lg px-3 py-3 cursor-pointer hover:bg-surface">
            <div class="convo-icon flex h-9 w-9 items-center justify-center rounded-full bg-primary-container text-sm font-semibold text-on-primary-container">U</div>
            <div class="min-w-0 flex-1">
                <span class="convo-name block truncate text-sm font-medium">User</span>
            </div>
        </div>
    </template>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
