services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: development
      APP_BASE_URL: http://localhost:8080
      CLIENT_ORIGIN: http://localhost:8080
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat_app
      REDIS_URL: redis://redis:6379
      AUTH_TOKEN_SECRET: change-me-before-production
      REFRESH_TOKEN_SECRET: change-me-too-before-production
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 2592000
      PRESENCE_TTL_SECONDS: 45
      TYPING_TTL_SECONDS: 5
      HEARTBEAT_INTERVAL_MS: 30000
      MESSAGE_HISTORY_PAGE_SIZE: 50
      MAX_MESSAGE_LENGTH: 2000
      HTTP_LOGIN_LIMIT_PER_SECOND: 5
      HTTP_SEARCH_LIMIT_PER_SECOND: 5
      WS_MESSAGE_LIMIT_PER_SECOND: 10
      WS_EVENT_LIMIT_PER_SECOND: 30
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat_app
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
